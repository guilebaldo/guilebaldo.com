<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45.5" stroke="#ffffff" stroke-width="3.6"/>
  <!--
    Abstract G:
    1) arc open on the right
    2) vertical rise from lower terminal → forms the inner-right corner
    3) horizontal bar into the center node
  -->
  <path
    d="M 73.5 31.5
       A 30 30 0 1 0 73.5 68.5
       L 73.5 50
       L 56 50"
    stroke="#ffffff"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="miter"
    stroke-miterlimit="8"
  />
  <!-- Center node -->
  <circle cx="50" cy="50" r="5.2" stroke="#ffffff" stroke-width="3.2"/>
</svg>
